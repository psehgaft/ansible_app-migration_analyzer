---
- name: Validate that the source path exists
  ansible.builtin.stat:
    path: "{{ source_code_path }}"
  register: src_path_check

- name: Fail when the source path does not exist
  ansible.builtin.fail:
    msg: "The source-code path '{{ source_code_path }}' does not exist."
  when: not src_path_check.stat.exists

- name: Create output directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ output_dir }}"
    - "{{ wsdl_output_dir }}"

- name: Run the .NET source-code analysis script
  ansible.builtin.script:
    cmd: "analyze_code.py '{{ source_code_path }}'"
  register: raw_analysis_result

- name: Parse the JSON analysis result
  ansible.builtin.set_fact:
    analysis: "{{ raw_analysis_result.stdout | from_json }}"

- name: Copy discovered WSDL files to the output directory
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ wsdl_output_dir }}/{{ item | basename }}"
    remote_src: true
  loop: "{{ analysis.wsdl_files }}"
  when: analysis.wsdl_files | length > 0

- name: Generate the migration-complexity HTML report
  ansible.builtin.template:
    src: "report.html.j2"
    dest: "{{ report_file }}"
    mode: '0644'

- name: Display the final summary
  ansible.builtin.debug:
    msg:
      - "=== ANALYSIS COMPLETE ==="
      - "Total classes: {{ analysis.total_classes }}"
      - "WSDL files copied: {{ analysis.wsdl_files | length }}"
      - ".NET Core complexity: {{ analysis.score_net_core }}"
      - "Java (Quarkus) complexity: {{ analysis.score_quarkus }}"
      - "Report generated at: {{ report_file }}"
